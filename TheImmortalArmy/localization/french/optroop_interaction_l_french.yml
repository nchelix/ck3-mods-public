# Untranslated placeholder: English strings. Replace with a real french translation.
 open_optroop_menu:0 "Open Immortal Army Menu"
 open_optroop_menu_desc:0 "[recipient.GetShortUINameNoTooltip|U] will get Immortal Army Options"
 close_optroop_menu:0 "Close Immortal Army Menu"
 close_optroop_menu_desc:0 "[recipient.GetShortUINameNoTooltip|U] will close Immortal Army Options"
 inheritable_optroop_interaction:0 "Spawn 500 Inheritable Immortal Soldiers"
 inheritable_optroop_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] will receive 500 Immortal Soldiers that will be passed down to their heirs.\n\nAre you ready to take over the world with an army of unkillable machines?"
 non_inheritable_optroop_interaction:0 "Spawn 500 Uninherited Immortal Soldiers"
 non_inheritable_optroop_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] will receive 500 Immortal Soldiers only for their use.\n\nThese troops are loyal only to you and will not be inherited."
 inheritable_optroop_cavalry_interaction:0 "Spawn 500 Inheritable Immortal Riders"
 inheritable_optroop_cavalry_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] will receive 500 Immortal Riders that will be passed down to their heirs."
 non_inheritable_optroop_cavalry_interaction:0 "Spawn 500 Uninherited Immortal Riders"
 non_inheritable_optroop_cavalry_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] will receive 500 Immortal Riders only for their use."
 inheritable_optroop_archers_interaction:0 "Spawn 500 Inheritable Immortal Bowmen"
 inheritable_optroop_archers_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] will receive 500 Immortal Bowmen that will be passed down to their heirs."
 non_inheritable_optroop_archers_interaction:0 "Spawn 500 Uninherited Immortal Bowmen"
 non_inheritable_optroop_archers_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] will receive 500 Immortal Bowmen only for their use."
 optroop_strength_godlike_interaction:0 "Strength: Godlike"
 optroop_strength_godlike_interaction_desc:0 "Your Immortal Army will be raised at full strength: 1000 damage and 1000 toughness. This is the default.\n\nOnly affects armies you spawn from now on. Armies you have already raised stay as they are."
 optroop_strength_elite_interaction:0 "Strength: Elite"
 optroop_strength_elite_interaction_desc:0 "Your Immortal Army will be raised as elite troops, roughly three times the best ordinary men-at-arms of their kind.\n\nOnly affects armies you spawn from now on. Armies you have already raised stay as they are."
 optroop_strength_regular_interaction:0 "Strength: Regular"
 optroop_strength_regular_interaction_desc:0 "Your Immortal Army will be raised as regular troops, slightly better than the best ordinary men-at-arms of their kind.\n\nOnly affects armies you spawn from now on. Armies you have already raised stay as they are."
 optroop_strength_already_set:0 "Not already your Immortal Army's strength"
