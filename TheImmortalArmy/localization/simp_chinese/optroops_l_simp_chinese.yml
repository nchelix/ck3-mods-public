l_simp_chinese:
# Untranslated placeholder: English strings. Replace with a real simp_chinese translation.
 op_troops:0 "Immortal Army"
 op_troops_flavor:0 "#F The original Immortal Army. Five hundred heavy infantry who do not lose; nothing in the world can break them, and they break everything.#!"
 op_troops_cavalry:0 "Immortal Riders"
 op_troops_cavalry_flavor:0 "#F Immortal heavy horse. They run down anything that breaks, and nothing that flees from them gets away.#!"
 op_troops_archers:0 "Immortal Bowmen"
 op_troops_archers_flavor:0 "#F Immortal archers. They open the battle before a line has even formed, and the other side never recovers.#!"
 op_troops_elite:0 "Elite Immortal Army"
 op_troops_elite_flavor:0 "#F Immortal infantry at Elite strength, roughly three times the best ordinary men-at-arms. Still far beyond any common soldier, but no longer beyond defeat.#!"
 op_troops_regular:0 "Regular Immortal Army"
 op_troops_regular_flavor:0 "#F Immortal infantry at Regular strength, a little better than the best men-at-arms of their kind. The gentlest way to field the Immortal Army.#!"
 op_troops_cavalry_elite:0 "Elite Immortal Riders"
 op_troops_cavalry_elite_flavor:0 "#F Immortal heavy horse at Elite strength, roughly three times the best ordinary cavalry. Their charge still breaks most lines.#!"
 op_troops_cavalry_regular:0 "Regular Immortal Riders"
 op_troops_cavalry_regular_flavor:0 "#F Immortal heavy horse at Regular strength, a little better than the best ordinary cavalry. A strong charge, and no more than that.#!"
 op_troops_archers_elite:0 "Elite Immortal Bowmen"
 op_troops_archers_elite_flavor:0 "#F Immortal archers at Elite strength, roughly three times the best ordinary bowmen. Their volleys still decide most battles.#!"
 op_troops_archers_regular:0 "Regular Immortal Bowmen"
 op_troops_archers_regular_flavor:0 "#F Immortal archers at Regular strength, a little better than the best ordinary bowmen. Steady, accurate fire, and no more than that.#!"
