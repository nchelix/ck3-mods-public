# Untranslated placeholder: English strings. Replace with a real korean translation.
 snake_looks_interaction:0 "Snake Looks"
 snake_looks_interaction_desc:0 "Choose how [recipient.GetShortUINameNoTooltip] should look.\n\nDon't step on snek."
 snake_looks_heading:0 "Choose a look:"
 snake_look_scaly:0 "Snake appearance"
 snake_look_scaly_desc:0 "Scales and a colder colouring, on this character alone. It will not pass to their children."
 snake_look_serpent:0 "Full serpent"
 snake_look_serpent_desc:0 "They go all the way: heavy scales, no lashes, milk-pale eyes. It will not pass to their children.\n\nThe portrait shows it only with disturbing portrait modifiers switched on in the game settings."
 snake_look_bloodline:0 "Snake bloodline"
 snake_look_bloodline_desc:0 "The scaled look, and every child born to them afterwards will inherit it, and their children in turn."
 snake_look_children:0 "Give their children the bloodline"
 snake_look_children_desc:0 "Every child they already have who is not yet a snake joins the snake bloodline. Their own appearance does not change."
 snake_look_remove:0 "Natural appearance"
 snake_look_remove_desc:0 "They stop being a snake, whichever snake look they have.\n\nSnakes are weird. I have decided I am not a reptile after all."
 snake_look_already_has_tt:0 "They already have this look"
 snake_looks_choose_tt:0 "Choose a look first"
