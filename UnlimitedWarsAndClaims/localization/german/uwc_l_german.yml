l_german:
 rule_uwc_shared_titles:0 "#P Unlimited Wars and Claims:#! Several titles in one war"
 setting_uwc_shared_titles_off:0 "Off"
 setting_uwc_shared_titles_off_desc:0 "Vanilla: most wars target a single title."
 setting_uwc_shared_titles_players:0 "Players"
 setting_uwc_shared_titles_players_desc:0 "Players may pick several titles in one war; the AI targets one."
 setting_uwc_shared_titles_everyone:0 "Everyone"
 setting_uwc_shared_titles_everyone_desc:0 "Every ruler, players and AI, may pick several titles in one war."
 rule_uwc_multiple_claims:0 "#P Unlimited Wars and Claims:#! Several claims in one war"
 setting_uwc_multiple_claims_off:0 "Off"
 setting_uwc_multiple_claims_off_desc:0 "Vanilla: pressing several claims in one war needs Chronicle Writing for your own claims and Divine Right for others'."
 setting_uwc_multiple_claims_players:0 "Players"
 setting_uwc_multiple_claims_players_desc:0 "Players press several claims in one war without those innovations; the AI still needs them."
 setting_uwc_multiple_claims_everyone:0 "Everyone"
 setting_uwc_multiple_claims_everyone_desc:0 "Every ruler presses several claims in one war without those innovations."
 rule_uwc_dejure_wars:0 "#P Unlimited Wars and Claims:#! De jure wars"
 setting_uwc_dejure_wars_off:0 "Off"
 setting_uwc_dejure_wars_off_desc:0 "Vanilla: the de jure casus belli needs Divine Right."
 setting_uwc_dejure_wars_players:0 "Players"
 setting_uwc_dejure_wars_players_desc:0 "Players may use the de jure casus belli without Divine Right; the AI still needs it."
 setting_uwc_dejure_wars_everyone:0 "Everyone"
 setting_uwc_dejure_wars_everyone_desc:0 "Every ruler may use the de jure casus belli without Divine Right."
 rule_uwc_raised_armies:0 "#P Unlimited Wars and Claims:#! War with raised armies"
 setting_uwc_raised_armies_off:0 "Off"
 setting_uwc_raised_armies_off_desc:0 "Vanilla: you cannot declare war while your armies are raised."
 setting_uwc_raised_armies_players:0 "Players"
 setting_uwc_raised_armies_players_desc:0 "Players may declare war with armies raised, as long as none stands in the defender's lands; the AI may not."
 setting_uwc_raised_armies_everyone:0 "Everyone"
 setting_uwc_raised_armies_everyone_desc:0 "Every ruler may declare war with armies raised, as long as none stands in the defender's lands."
