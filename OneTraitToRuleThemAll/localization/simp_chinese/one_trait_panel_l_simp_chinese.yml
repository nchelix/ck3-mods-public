 one_trait_panel_power_builder:0 "The Realm Builds Itself"
 one_trait_panel_power_builder_tt:0 "#bold The Realm Builds Itself#!\nYearly, a new building, or every building one level higher, in every county you hold.\n\nClick to wake it or still it. A locked power needs the Sanctum raised first."
