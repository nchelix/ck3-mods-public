 one_trait_panel_power_all_seeing:0 "All-Seeing"
 one_trait_panel_power_all_seeing_tt:0 "#bold All-Seeing#!\nMonthly, every secret of your vassals and courtiers is revealed to you, and every scheme against you is exposed.\n\nClick to wake it or still it. A locked power needs the Sanctum raised first."
 one_trait_panel_power_leash:0 "The Leash"
