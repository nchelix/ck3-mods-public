 one_trait_panel_power_golden_age_tt:0 "#bold Golden Age#!\nYearly, +1 development in every county you hold.\n\nClick to wake it or still it. A locked power needs the Sanctum raised first."
 one_trait_panel_power_one_faith:0 "One Faith"
