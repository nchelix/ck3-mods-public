 one_trait_menu.1000.desc:0 "Make [one_trait_target.GetShortUINameNoTooltip] your puppet, whatever your faith. Then right-click anyone, choose the puppet in the puppets row, and act through them. You hold one puppet of each kind: a new one replaces the old."
