 one_trait_menu.1450.t:0 "Hostility"
 one_trait_menu.1450.desc:0 "Deal with [one_trait_target.GetShortUINameNoTooltip] as you see fit. No plot, no crime, no witnesses."
 one_trait_menu.1450.strike:0 "Strike them dead"
 one_trait_menu.1450.imprison:0 "Throw them in my dungeon"
 one_trait_menu.1450.free:0 "Free them from prison"
 one_trait_menu.1450.banish:0 "Banish them from my court"
 one_trait_menu.1450.excommunicate:0 "Excommunicate them"
