# Untranslated placeholder: English strings. Replace with a real french translation.
# \regiment_types
 one_army:0 "The Army of the One Trait"
 one_trait_legion:0 "Legion of the One"
 one_trait_legion_flavor:0 "#F The One Trait's own infantry, in white enamel and gold. No blow breaks their shield wall, and no castle wall stands long before them.#!"
 one_trait_bowmen:0 "Bowmen of the One"
 one_trait_bowmen_flavor:0 "#F Archers of the One Trait, whose gold-fletched volleys darken the sky. Nothing on any field hits harder.#!"
 one_trait_riders:0 "Riders of the One"
 one_trait_riders_flavor:0 "#F The One Trait's heavy horse. Their charge breaks any line, and nothing that flees from them survives the pursuit.#!"
 one_trait_legion_elite:0 "Elite Legion of the One"
 one_trait_legion_elite_flavor:0 "#F The One Trait's infantry in tempered steel and silver. Far beyond any common soldier, and still they can be worn down by enough men.#!"
 one_trait_bowmen_elite:0 "Elite Bowmen of the One"
 one_trait_bowmen_elite_flavor:0 "#F Archers of the One Trait in steel-grey fletching. Their volleys hit harder than any crossbow in the land, but not harder than a long war.#!"
 one_trait_riders_elite:0 "Elite Riders of the One"
 one_trait_riders_elite_flavor:0 "#F The One Trait's heavy horse in silvered mail. A charge that breaks lesser cavalry, and a pursuit that few outrun.#!"
 one_trait_legion_regular:0 "Legion of the One (Regular)"
 one_trait_legion_regular_flavor:0 "#F Plain-armoured infantry of the One Trait. A shade better than the finest the realms can field, so a battle with them is a battle that lasts.#!"
 one_trait_bowmen_regular:0 "Bowmen of the One (Regular)"
 one_trait_bowmen_regular_flavor:0 "#F Archers of the One Trait in plain kit. A little better than the best crossbowmen, and no more than that.#!"
 one_trait_riders_regular:0 "Riders of the One (Regular)"
 one_trait_riders_regular_flavor:0 "#F The One Trait's heavy horse, plainly mounted. Slightly better than the finest lancers, for a fair fight with a cheaty edge.#!"
 one_trait_tireless_armies:0 "One Trait: Tireless Armies"
 one_trait_swift_armies:0 "One Trait: Swift Armies"
 one_trait_swift_command:0 "One Trait: Swift Command"
