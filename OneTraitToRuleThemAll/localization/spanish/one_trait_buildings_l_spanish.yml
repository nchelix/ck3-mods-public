# Untranslated placeholder: English strings. Replace with a real spanish translation.
 building_type_one_trait_sanctum_01:0 "Sanctum of the One"
 building_type_one_trait_sanctum_01_desc:0 "A spire of white stone and gold, crowned by the Ring of the One Trait. No army has ever taken the county it stands in."
 building_one_trait_sanctum_01:0 "$building_type_one_trait_sanctum_01$"
 building_one_trait_sanctum_01_desc:0 "$building_type_one_trait_sanctum_01_desc$"
 story_one_trait_sanctum:0 "The Sanctum of the One"
 story_one_trait_sanctum_desc:0 "The Sanctum stands, and its powers answer to you. Command them from the One Trait panel's Sanctum category."
 ONE_TRAIT_SANCTUM_STATUS:0 "The Sanctum stands in #V [Story.MakeScope.Var('sanctum_province').GetProvince.GetName]#!. Switch its powers in the One Trait panel's Sanctum category.\n\n#bold Builder#!: The Realm Builds Itself [Story.Custom('OneTraitSanctumBuilder')], Golden Age [Story.Custom('OneTraitSanctumGoldenAge')]\n#bold Dominion#!: One Faith [Story.Custom('OneTraitSanctumOneFaith')], One People [Story.Custom('OneTraitSanctumOnePeople')]\n#bold The Eye#!: All-Seeing [Story.Custom('OneTraitSanctumAllSeeing')], The Leash [Story.Custom('OneTraitSanctumLeash')], No Dissent [Story.Custom('OneTraitSanctumNoDissent')]\n#bold The Forge#!: Relic Forge [Story.Custom('OneTraitSanctumRelicForge')], Hall of Champions [Story.Custom('OneTraitSanctumChampions')], Eternal Levies [Story.Custom('OneTraitSanctumLevies')]\n#bold Tribute#!: World Tribute [Story.Custom('OneTraitSanctumTribute')]"
 one_trait_sanctum_status_on:0 "#P On#!"
 one_trait_sanctum_status_off:0 "Off"
 one_trait_sanctum_msg_builder.t:0 "The Sanctum: The Realm Builds Itself"
 one_trait_sanctum_msg_builder.desc:0 "New and grander buildings rose in #V [sanctum_count|0]#! of your counties."
 one_trait_sanctum_msg_golden_age.t:0 "The Sanctum: Golden Age"
 one_trait_sanctum_msg_golden_age.desc:0 "#V [sanctum_count|0]#! of your counties grew in development."
 one_trait_sanctum_msg_one_faith.t:0 "The Sanctum: One Faith"
 one_trait_sanctum_msg_one_faith.desc:0 "#V [sanctum_count|0]#! counties of your realm took up your faith."
 one_trait_sanctum_msg_one_people.t:0 "The Sanctum: One People"
 one_trait_sanctum_msg_one_people.desc:0 "#V [sanctum_count|0]#! counties of your realm took up your culture."
 one_trait_sanctum_msg_all_seeing.t:0 "The Sanctum: All-Seeing"
 one_trait_sanctum_msg_all_seeing.desc:0 "#V [sanctum_count|0]#! secrets revealed to you, #V [sanctum_count_2|0]#! schemes against you exposed."
 one_trait_sanctum_msg_leash.t:0 "The Sanctum: The Leash"
 one_trait_sanctum_msg_leash.desc:0 "You now hold a strong hook on #V [sanctum_count|0]#! more of your vassals."
 one_trait_sanctum_msg_no_dissent.t:0 "The Sanctum: No Dissent"
 one_trait_sanctum_msg_no_dissent.desc:0 "#V [sanctum_count|0]#! factions against you dissolved."
 one_trait_sanctum_msg_relic_forge.t:0 "The Sanctum: Relic Forge"
 one_trait_sanctum_msg_relic_forge.desc:0 "A new Relic of the One Trait has been forged for your treasury."
 one_trait_sanctum_msg_champions.t:0 "The Sanctum: Hall of Champions"
 one_trait_sanctum_msg_champions.desc:0 "A new champion has come to your court."
 one_trait_sanctum_msg_tribute.t:0 "The Sanctum: World Tribute"
 one_trait_sanctum_msg_tribute.desc:0 "The rulers of the world paid you #V [sanctum_count|0]#! gold in tribute."
