 one_trait_menu.1500.t:0 "Summon"
 one_trait_menu.1500.desc:0 "Call new people to your court, of your culture and faith. Each choice summons one more."
 one_trait_menu.1500.chancellor:0 "Summon a master Chancellor"
 one_trait_menu.1500.chancellor.tt:0 "A loyal diplomat of the highest education joins your court and takes the Chancellor's seat. Your current Chancellor stays at court."
 one_trait_menu.1500.marshal:0 "Summon a master Marshal"
 one_trait_menu.1500.marshal.tt:0 "A loyal commander of the highest education joins your court and takes the Marshal's seat. Your current Marshal stays at court."
 one_trait_menu.1500.steward:0 "Summon a master Steward"
 one_trait_menu.1500.steward.tt:0 "A loyal administrator of the highest education joins your court and takes the Steward's seat. Your current Steward stays at court."
 one_trait_menu.1500.spymaster:0 "Summon a master Spymaster"
 one_trait_menu.1500.spymaster.tt:0 "A loyal schemer of the highest education joins your court and takes the Spymaster's seat. Your current Spymaster stays at court."
 one_trait_menu.1500.chaplain:0 "Summon a master Court Chaplain"
 one_trait_menu.1500.chaplain.tt:0 "A loyal scholar of your faith, of the highest education, joins your court and takes the Court Chaplain's seat. Your current Court Chaplain stays at court."
 one_trait_menu.1500.champion:0 "Summon a champion"
 one_trait_menu.1500.champion.tt:0 "A brave, strong warrior and commander joins your court, ready to be a knight or to lead your armies."
 one_trait_menu.1500.spouse:0 "Summon a spouse candidate"
 one_trait_menu.1500.spouse.tt:0 "A beautiful, brilliant, strong and fertile adult joins your court, unmarried. Marry them through Family."
 one_trait_menu.1500.ward:0 "Summon a gifted ward"
 one_trait_menu.1500.ward.tt:0 "A beautiful child genius of six joins your court, ready for a guardian or a betrothal."
