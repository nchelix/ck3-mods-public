 one_trait_menu.0620.t:0 "The Sanctum of the One"
 one_trait_menu.0620.desc:0 "A spire of white stone and gold, crowned by the Ring. Raised, it makes its county unassailable; its powers wake only when you call them."
 one_trait_menu.0620.raise:0 "Raise the Sanctum in the capital county"
