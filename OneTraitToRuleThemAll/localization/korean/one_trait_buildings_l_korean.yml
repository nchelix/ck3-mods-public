 one_trait_menu.0620.back:0 "Back"
 building_type_one_trait_sanctum_01:0 "Sanctum of the One"
 building_type_one_trait_sanctum_01_desc:0 "A spire of white stone and gold, crowned by the Ring of the One Trait. No army has ever taken the county it stands in."
 building_one_trait_sanctum_01:0 "$building_type_one_trait_sanctum_01$"
 building_one_trait_sanctum_01_desc:0 "$building_type_one_trait_sanctum_01_desc$"
 story_one_trait_sanctum:0 "The Sanctum of the One"
 story_one_trait_sanctum_desc:0 "The Sanctum stands, and its powers answer to you. Command them from the One Trait menu: Buildings, then The Sanctum."
 one_trait_menu.0620.raise_blocked:0 "Cannot raise: every capital barony already has a wonder"
 one_trait_menu.0620.builder_page:0 "Builder and Dominion"
 one_trait_menu.0620.eye_page:0 "The Eye"
 one_trait_menu.0620.forge_page:0 "The Forge and Tribute"
 one_trait_menu.0621.t:0 "The Sanctum: Builder and Dominion"
 one_trait_menu.0621.desc:0 "#bold The Realm Builds Itself#!: yearly, a new building, or every building one level higher, in every county you hold.\n#bold Golden Age#!: yearly, +1 development in every county you hold.\n#bold One Faith#!: yearly, every county in your realm converts to your faith. It rewrites the map.\n#bold One People#!: yearly, every county in your realm converts to your culture. It rewrites the map."
 one_trait_menu.0622.t:0 "The Sanctum: The Eye"
 one_trait_menu.0622.desc:0 "#bold All-Seeing#!: monthly, every secret of your vassals and courtiers is revealed to you, and every scheme against you is exposed.\n#bold The Leash#!: yearly, a strong hook on every vassal.\n#bold No Dissent#!: monthly, every faction against you dissolves."
 one_trait_menu.0623.t:0 "The Sanctum: The Forge and Tribute"
 one_trait_menu.0623.desc:0 "#bold Relic Forge#!: yearly, a Relic of the One Trait for your treasury.\n#bold Hall of Champions#!: yearly, a prowess-30 champion joins your court, up to 10.\n#bold Eternal Levies#!: monthly, every regiment refilled and grown to full size.\n#bold World Tribute#!: monthly, every other independent ruler pays you a tenth of their income. It weakens every AI realm."
