 one_trait_menu.0620.invoke:0 "Invoke every awakened power now"
 ONE_TRAIT_SANCTUM_STATUS:0 "The Sanctum stands in #V [Story.MakeScope.Var('sanctum_province').GetProvince.GetName]#!. Switch its powers in the One Trait menu: Buildings, then The Sanctum.\n\n#bold Builder#!: The Realm Builds Itself [Story.Custom('OneTraitSanctumBuilder')], Golden Age [Story.Custom('OneTraitSanctumGoldenAge')]\n#bold Dominion#!: One Faith [Story.Custom('OneTraitSanctumOneFaith')], One People [Story.Custom('OneTraitSanctumOnePeople')]\n#bold The Eye#!: All-Seeing [Story.Custom('OneTraitSanctumAllSeeing')], The Leash [Story.Custom('OneTraitSanctumLeash')], No Dissent [Story.Custom('OneTraitSanctumNoDissent')]\n#bold The Forge#!: Relic Forge [Story.Custom('OneTraitSanctumRelicForge')], Hall of Champions [Story.Custom('OneTraitSanctumChampions')], Eternal Levies [Story.Custom('OneTraitSanctumLevies')]\n#bold Tribute#!: World Tribute [Story.Custom('OneTraitSanctumTribute')]"
 one_trait_sanctum_status_on:0 "#P On#!"
 one_trait_sanctum_status_off:0 "Off"
