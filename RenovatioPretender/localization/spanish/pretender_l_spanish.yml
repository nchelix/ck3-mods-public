l_spanish:
 trait_roman_pretender:0 "Pretender to Rome"
 trait_roman_pretender_desc:0 "This character claims descent from the Caesars, and means to prove it with a sword."
 trait_roman_pretender_character_desc:0 "[ROOT.Char.GetFirstName] claims descent from the Caesars. Whether the claim is true matters less every year it is believed."
 secret_forged_lineage:0 "Forged Lineage"
 secret_forged_lineage_desc:0 "Has fabricated a descent from the Julian house"
 secret_forged_lineage_tooltip_desc:0 "[CHARACTER.GetShortUINameNoFormat|U] bought [CharHisHer(CHARACTER)] Roman ancestry from forgers and bribed archivists"
 secret_forged_lineage_type_desc:0 "This character fabricated a descent from the Julian house"
 pretender_support_sympathetic_modifier:0 "Sympathetic to the Pretender"
 pretender_support_sympathetic_modifier_desc:0 "Talk in the markets favours a pretender to Rome."
 pretender_support_supportive_modifier:0 "Supports the Pretender"
 pretender_support_supportive_modifier_desc:0 "The people here openly back a pretender to Rome."
 pretender_support_fervent_modifier:0 "Fervent for the Pretender"
 pretender_support_fervent_modifier_desc:0 "The people here would rise tomorrow for a pretender to Rome."
 pretender_pledged_modifier:0 "Pledged to the Pretender"
 pretender_pledged_modifier_desc:0 "Has sworn support to a pretender to Rome."
 pretender_bound_by_oath_modifier:0 "Bound by Oath"
 pretender_bound_by_oath_modifier_desc:0 "Swore faith to the patron who granted this land. Rising against them would brand this character an oathbreaker."
 pretender_pledge_opinion:0 "Pledged to their cause"
 pretender_exposed_fraud_opinion:0 "Exposed fraud"
 pretender_oathbreaker_opinion:0 "Oathbreaker"
 commission_julian_genealogy_decision:0 "Commission a Julian Genealogy"
 commission_julian_genealogy_decision_desc:0 "Every family is descended from someone. With the right archivist, the right scholar and the right relic, ours is descended from the Caesars."
 commission_julian_genealogy_decision_tooltip:0 "Begin forging a descent from the Julian house. It will take a year or two, and leave a secret that could undo you."
 commission_julian_genealogy_decision_confirm:0 "Send for the forgers"
 pretender.0001.t:0 "Whose Blood?"
 pretender.0001.desc:0 "The forger unrolls two family trees, both entirely plausible and entirely invented. Which Caesar shall I descend from?"
 pretender.0001.a:0 "Julius, the people's general."
 pretender.0001.b:0 "Augustus, the founder of order."
 pretender.0002.t:0 "The Archive"
 pretender.0002.desc:0 "A monastery holds records old enough to be believed. Its archivist can be persuaded, one way or another, to find what we need."
 pretender.0002.a:0 "Pay him. Well."
 pretender.0002.b:0 "Remind him who his friends are."
 pretender.0002.c:0 "We do not need the monks."
 pretender.0003.t:0 "The Documents"
 pretender.0003.desc:0 "The charters must be written in the old hand, on old vellum, with the old mistakes."
 pretender.0003.a:0 "I will write them myself."
 pretender.0003.b:0 "Hire the Greek. He is the best."
 pretender.0003.c:0 "Rough copies will do."
 pretender.0004.t:0 "The Relic"
 pretender.0004.desc:0 "A ring, a seal, a fragment of a standard — anything the crowd can touch. The ruins are full of such things, if one knows where to bury them first."
 pretender.0004.a:0 "Stage the discovery myself, before witnesses."
 pretender.0004.b:0 "Pay the monks to swear to it."
 pretender.0004.c:0 "The documents will suffice."
 pretender.0005.t:0 "Heir of the Caesars"
 pretender.0005.desc:0 "It is done. The charters are sealed, the relic is displayed, and the story is already running ahead of me through the markets. Now I must make the world believe it."
 pretender.0005.a:0 "Let them come and see."
 bread_and_games_decision:0 "Bread and Games"
 bread_and_games_decision_desc:0 "Grain for the hungry, games for the bored, and my name in every mouth."
 bread_and_games_decision_tooltip:0 "Raise support for your cause in the county where your camp stands, and perhaps its neighbours."
 speak_in_the_forum_decision:0 "Speak in the Forum"
 speak_in_the_forum_decision_desc:0 "Stand where the Caesars stood and tell the people what they have lost."
 speak_in_the_forum_decision_tooltip:0 "Raise support for your cause in the county where your camp stands."
 pretender_camp_in_roman_lands_tt:0 "Your camp stands within the old borders of Rome"
 seek_pretender_pledge_interaction:0 "Seek Their Pledge"
 seek_pretender_pledge_interaction_desc:0 "Ask [recipient.GetShortUIName] to put [recipient.GetHerHis] name to your cause."
 seek_pretender_pledge_interaction_declined:0 "Pledge Refused"
 pretender_already_pledged_tt:0 "Has already pledged to a pretender"
 pretender_offer_gold:0 "Offer 100 [gold|E]"
 pretender_reason_prestige:0 "Your renown"
 pretender_reason_gold:0 "Gold offered"
 pretender_reason_culture:0 "Same culture"
 pretender_reason_faith:0 "Same faith"
 pretender_reason_grudge:0 "Resents their liege"
 pretender_reason_ambitious:0 "Ambitious or greedy"
 pretender_reason_loyal:0 "Content or loyal"
 pretender_reason_augustus:0 "Heir of Augustus"
 pretender.0020.t:0 "The Lie Laid Bare"
 pretender.0020.desc_ruin:0 "The archivist talked. The Greek talked. Now all of Italy is laughing, and the lords who swore to me have remembered urgent business elsewhere."
 pretender.0020.desc_legend:0 "They say my charters are forgeries. The crowds in the square do not care: they have seen me, and they want what I promised. Some ground is lost, but the cause stands."
 pretender.0020.desc_landed:0 "They say my charters are forgeries. Let them. The land is mine, and the claim is made in steel now, not in ink."
 pretender.0020.a:0 "So be it."
 pretender.0030.t:0 "A Caesar Rises"
 pretender.0030.desc:0 "For years I was a name shouted in markets. Now I have land under my feet, and the name is a claim. From here, Rome."
 pretender.0030.a:0 "The Renovatio begins."
 pretender_uprising_cb:0 "Rise for Rome"
 PRETENDER_UPRISING_WAR_NAME:0 "Rising of the Pretender [ATTACKER.GetFirstName]"
 pretender_uprising_troops:0 "Roman Rising"
 pretender_pledged_detachment:0 "Pledged Detachment"
 raise_the_standard_decision:0 "Raise the Standard"
 raise_the_standard_decision_desc:0 "The people are ready and the nobles have sworn. One word, and the duchy rises."
 raise_the_standard_decision_tooltip:0 "Mark the supportive counties of your camp's duchy for an uprising."
 raise_the_standard_decision_effect_tt:0 "You may now declare the Rise for Rome war on the lord of those counties."
 pretender_needs_pledges_tt:0 "At least 2 lords have pledged to you"
 pretender_needs_counties_tt:0 "At least 3 counties in your camp's duchy Support you or are Fervent"
 receive_patrimony_interaction:0 "Receive the Patrimony"
 receive_patrimony_interaction_desc:0 "Ask [recipient.GetShortUIName] to grant you a county of [recipient.GetHerHis] own. You would hold it as [recipient.GetHerHis] vassal, bound by oath and owing [recipient.GetHerHim] a strong hook."
 receive_patrimony_interaction_declined:0 "Patrimony Refused"
 pretender_patron_needs_two_counties_tt:0 "Holds at least two counties directly"
 pretender_patrimony_gold_tt:0 "You have 300 [gold|E] to pay for the grant"
 pretender.0050.t:0 "Oathbreaker"
 pretender.0050.desc:0 "I swore faith to the one who gave me land, and now I have taken up arms against [patron.GetHerHim]. The whole world has noticed."
 pretender.0050.a:0 "Oaths are for lesser men."
