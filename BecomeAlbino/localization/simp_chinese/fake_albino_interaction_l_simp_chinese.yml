# Untranslated placeholder: English strings. Replace with a real simp_chinese translation.
 albino_looks_interaction:0 "Albino Looks"
 albino_looks_interaction_desc:0 "Choose how [recipient.GetShortUINameNoTooltip] should look.\n\nPale skin, white hair, eyes like a winter sunrise. Let the court make of it what they will."
 albino_looks_heading:0 "Choose a look:"
 albino_look_appearance:0 "Albino appearance"
 albino_look_appearance_desc:0 "Pale skin, white hair and red eyes, on this character alone. It will not pass to their children."
 albino_look_bloodline:0 "Albino bloodline"
 albino_look_bloodline_desc:0 "The same look, and every child born to them afterwards will inherit it, and their children in turn."
 albino_look_true:0 "True albinism"
 albino_look_true_desc:0 "The game's own albino trait, with all of its effects: more dread, warmer opinions from other albinos, cooler ones from most other people. It is genetic, so the game passes it down in its own way."
 albino_look_children:0 "Give their children the bloodline"
 albino_look_children_desc:0 "Every child they already have who has no albino look yet is given the albino bloodline. Their own appearance does not change."
 albino_look_remove:0 "Natural appearance"
 albino_look_remove_desc:0 "They return to their original appearance, whichever albino look they have.\n\nIt was a striking look, but it has run its course."
 albino_look_already_has_tt:0 "They already have this look"
 albino_looks_choose_tt:0 "Choose a look first"
