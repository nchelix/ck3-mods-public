# Untranslated placeholder: English strings. Replace with a real japanese translation.
 masks_interaction:0 "Masks"
 masks_interaction_desc:0 "Choose what [recipient.GetShortUINameNoTooltip] wears over their face.\n\nNobody cared who I was before I put on the mask."
 masks_heading:0 "Choose a mask:"
 mask_choice_plain:0 "The Mask"
 mask_choice_plain_desc:0 "The face vanishes behind the mask. Pure disguise: nothing else changes."
 mask_choice_bandaged:0 "Bandaged face"
 mask_choice_bandaged_desc:0 "They bind their face in linen. The same disguise, a rather different impression."
 mask_choice_dread:0 "The Dread Mask"
 mask_choice_dread_desc:0 "Fear will start to gather around them, and it is slow to fade.\n\nThe mask will terrify them, the mask will make them tremble."
 mask_choice_very_dread:0 "The Mask of Extreme Dread"
 mask_choice_very_dread_desc:0 "Terrified vassals will pay and serve far more generously.\n\nPeople will tremble at the sounds in the shadows. They should. They will never see your face again, but they will know you were there."
 mask_choice_remove:0 "Remove the mask"
 mask_choice_remove_desc:0 "They take off whichever mask they wear.\n\nYou're a big guy now."
 mask_already_worn_tt:0 "They already wear this mask"
 masks_choose_tt:0 "Choose a mask first"
