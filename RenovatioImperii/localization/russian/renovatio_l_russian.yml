l_russian:
# Untranslated placeholder: English strings. Replace with a real russian translation.
 proclaim_heir_to_rome_decision:0 "Proclaim Heir to Rome"
 proclaim_heir_to_rome_decision_confirm:0 "Proclaim the Renovatio Imperii."
 proclaim_heir_to_rome_decision_desc:0 "Rome fell centuries ago, but its inheritance never found an owner. [ROOT.Char.GetFirstNameNoTooltip] means to become one: not emperor of a realm that no longer exists, but claimant to one that might yet be rebuilt.\n\nThis is a proclamation, not a conquest. It costs a fortune in prestige and marks [ROOT.Char.GetFirstNameNoTooltip] before the whole world as a Roman claimant. It grants no land and no crown -- only the claim, and the great many enemies that come with pressing it."
 proclaim_heir_to_rome_decision_tooltip:0 "[ROOT.Char.GetFirstNameNoTooltip] weighs whether to proclaim a claim to Rome's inheritance, and with it, everything that proclamation would provoke."
 renovatio.0001.a:0 "Proclaim it a matter of blood and the sword."
 renovatio.0001.b:0 "Proclaim it a matter of Heaven's own favour."
 renovatio.0001.desc:0 "[ROOT.Char.GetFirstNameNoTooltip] stands before the court and calls upon a name older than any dynasty in the hall: Rome. An empire cannot be conjured by decree. A claim can, and today, one is.\n\nWord of this will travel a great deal further than the throne room. How it is framed now will decide who hears a restoration -- and who hears an insult."
 renovatio.0001.t:0 "The Proclamation"
 renovatio.0002.a:0 "Let the proclamation answer for itself."
 renovatio.0002.b:0 "Reply that Rome belongs to whoever renews it, not whoever inherited it."
 renovatio.0002.desc:0 "“[basileus.GetFirstNameNoTooltip] writes at length, in the manner of a man used to being obeyed rather than argued with. Constantinople has never fallen and never abdicated; the purple has passed hand to hand within its own walls since before your ancestors kept written records. A count, a duke, or a king who fancies himself Roman is, to the Basileus, simply a barbarian with better Latin.”\n\nThe letter ends without a threat. It does not need one."
 renovatio.0002.t:0 "To the pretender who has styled himself heir of Rome:\n\nRome has an heir already, and he does not sit in your hall."
 renovatio.0003.a:0 "Accept the coronation."
 renovatio.0003.b:0 "Refuse. Rule as your own man."
 renovatio.0003.desc:0 "[pontiff.GetFirstNameNoTooltip] has heard of the proclamation, and sees in it opportunity rather than blasphemy. Every emperor since Charlemagne owed his crown to a coronation performed by the Church; here is a new claimant who forgot to ask for one.\n\nWord arrives with the offer: submit to being crowned, and the office's blessing follows -- at the Church's price. Refuse, and rule as a self-made man, answerable to no one but himself."
 renovatio.0003.t:0 "The Pope's Offer"
 renovatio.0004.a:0 "Welcome the genuine scholar into your court."
 renovatio.0004.b:0 "Pay off the loudest of them and send the rest away."
 renovatio.0004.desc:0 "News of the proclamation has drawn an odd procession to court: genealogists tracing bloodlines back to the Julii, self-declared senators offering their service to a Senate that does not exist, and antiquarians eager to catalogue a restoration that has not yet happened.\n\nMost of them are chancers. Not quite all of them."
 renovatio.0004.t:0 "Antiquarians and Senators"
 renovatio.0005.a:0 "Denounce the pretender before the whole court."
 renovatio.0005.b:0 "Say nothing. Let the claim speak for itself."
 renovatio.0005.d:0 "[rival.GetFirstNameNoTooltip] has had precisely the same idea, and is asking no one's permission either. Two heirs to the same dead empire cannot both be right, and the world has begun to notice the contradiction."
 renovatio.0005.t:0 "A Rival Claimant"
 renovatio.0006.a:0 "So it stands, for now."
 renovatio.0006.d_powerful:0 "[ROOT.Char.GetFirstNameNoTooltip] rules an empire in fact, if not yet in the name the proclamation reached for. The old Roman mantle still hangs just out of reach -- close enough that the claim no longer sounds like boasting."
 renovatio.0006.d_pretender:0 "The proclamation stands where it began: a claim, an identity, and a great many enemies, with the empire itself still unwon. That is the honest state of things for most who reach for Rome."
 renovatio.0006.d_restored:0 "The proclamation has been made good. [ROOT.Char.GetFirstNameNoTooltip] does not merely claim Rome's inheritance -- [ROOT.Char.GetHerHim] holds it. What began as a claim on parchment now sits on a throne. History will not call this an imitation."
 renovatio.0006.t:0 "Judgement"
 renovatio_cb:0 "Renovatio Imperii"
 trait_roman_claimant:0 "Roman Claimant"
 trait_roman_claimant_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] has proclaimed a right to Rome's inheritance, and rules as though the old Empire might yet answer to that name again."
 trait_roman_claimant_desc:0 "This character has proclaimed a right to Rome's inheritance: no throne, no legions, only a claim and the enemies it has already made."
