 pantheon.0060.t: "A Prayer"
 pantheon.0060.desc_stranger: "[pantheon_suppliant.GetShortUINameNoTooltip], who does not follow you, kneels at the border of your faith's lands. \"Help me,\" they say, \"and I will follow you.\"\n\n"
 pantheon.0060.desc_host: "[pantheon_suppliant.GetShortUINameNoTooltip] is losing their war, and prays for the Host of Heaven to descend."
 pantheon.0060.desc_fertility: "[pantheon_suppliant.GetShortUINameNoTooltip] has no children, and prays for Divine Fertility."
 pantheon.0060.desc_vigor: "[pantheon_suppliant.GetShortUINameNoTooltip] feels the years, and prays for Divine Vigor."
 pantheon.0060.desc_warding: "Plague stalks [pantheon_suppliant.GetShortUINameNoTooltip]'s lands, and they pray to be Warded from Pestilence."
 pantheon.0060.desc_harvest: "[pantheon_suppliant.GetShortUINameNoTooltip] is poor and in debt, and prays for a Bountiful Harvest."
 pantheon.0060.desc_gift: "[pantheon_suppliant.GetShortUINameNoTooltip] prays for a divine gift."
