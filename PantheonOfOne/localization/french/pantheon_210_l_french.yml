l_french:
 # Pantheon of One 2.10 "Fire from Heaven". English only here; tools/sync_pantheon_loc.py copies this file to the other languages.

 # Task 1: death and opinions
 death_pantheon_fire: "was burned by fire from heaven"
 death_pantheon_fire_killer: "was burned by fire from heaven, called down by [TARGET_CHARACTER.GetUIName]"
 pantheon_fire_burned_world_opinion: "Burned a land with fire"
 pantheon_fire_survivor_opinion: "Burned my land and my kin"

 # Task 2: the interaction and its four sizes
 pantheon_fire_from_heaven_interaction: "Fire from Heaven"
 pantheon_fire_from_heaven_interaction_desc: "Call fire down from heaven on this ruler's realm. The land burns and its people die, and what is left falls back to tribal ruin. Your faithful and the Great Temple's own county are spared."
 pantheon_fire_opt_county: "Burn a county ([GetPlayer.MakeScope.ScriptValue('pantheon_cost_fire_county')|0] Worship)"
 pantheon_fire_opt_duchy: "Burn a duchy ([GetPlayer.MakeScope.ScriptValue('pantheon_cost_fire_duchy')|0] Worship)"
 pantheon_fire_opt_kingdom: "Burn a kingdom ([GetPlayer.MakeScope.ScriptValue('pantheon_cost_fire_kingdom')|0] Worship)"
 pantheon_fire_opt_empire: "Burn an empire ([GetPlayer.MakeScope.ScriptValue('pantheon_cost_fire_empire')|0] Worship)"
 pantheon_fire_desc_county: "Burns this ruler's capital county."
 pantheon_fire_desc_duchy: "Burns every county of this ruler's duchy."
 pantheon_fire_desc_kingdom: "Burns every county of this ruler's kingdom."
 pantheon_fire_desc_empire: "Burns every county of this ruler's empire."
 pantheon_fire_needs_worship_county_tt: "Requires [GetPlayer.MakeScope.ScriptValue('pantheon_cost_fire_county')|0] Worship (you have [GetPlayer.MakeScope.Var('pantheon_worship').GetValue|0])"
 pantheon_fire_needs_worship_duchy_tt: "Requires [GetPlayer.MakeScope.ScriptValue('pantheon_cost_fire_duchy')|0] Worship (you have [GetPlayer.MakeScope.Var('pantheon_worship').GetValue|0])"
 pantheon_fire_needs_worship_kingdom_tt: "Requires [GetPlayer.MakeScope.ScriptValue('pantheon_cost_fire_kingdom')|0] Worship (you have [GetPlayer.MakeScope.Var('pantheon_worship').GetValue|0])"
 pantheon_fire_needs_worship_empire_tt: "Requires [GetPlayer.MakeScope.ScriptValue('pantheon_cost_fire_empire')|0] Worship (you have [GetPlayer.MakeScope.Var('pantheon_worship').GetValue|0])"
 pantheon_fire_tip_county: "A county burns to a tribal ruin. Rulers and courtiers there may die; your faithful are spared."
 pantheon_fire_tip_duchy: "A duchy burns to a tribal ruin. Rulers and courtiers there may die; your faithful are spared."
 pantheon_fire_tip_kingdom: "A kingdom burns to a tribal ruin. Rulers and courtiers there may die; your faithful are spared."
 pantheon_fire_tip_empire: "An empire burns to a tribal ruin. Rulers and courtiers there may die; your faithful are spared."

 # Task 3: the strike refuses cleanly (no Worship spent, no cooldown)
 pantheon_fire_nothing_to_burn: "Nothing to burn"
 pantheon_fire_nothing_to_burn_tt: "Every county in that realm is spared (your faithful, the Great Temple's county), so no fire fell. No Worship was spent and the miracle is still ready."
 pantheon_fire_size_gone: "The fire has no target"
 pantheon_fire_size_gone_tt: "That ruler no longer holds the title you aimed at, so no fire fell. No Worship was spent and the miracle is still ready."
 pantheon_fire_fizzle: "The fire did not fall"
 pantheon_fire_fizzle_ready_tt: "The miracle is not ready: the Great Temple is not at full strength, or the miracle is still on cooldown. No Worship was spent."
 pantheon_fire_fizzle_target_tt: "That ruler is gone or can no longer be struck. No Worship was spent."
 pantheon_fire_fizzle_size_tt: "No size of fire was chosen. No Worship was spent."
 pantheon_fire_fizzle_worship_tt: "You do not have enough Worship for that fire. No Worship was spent."

 # Task 6: the reports
 pantheon_fire.0002.t: "Fire from Heaven"
 pantheon_fire.0002.desc.open: "The fire has fallen. "
 pantheon_fire.0002.desc.county_one: "1 county lies in ruin. "
 pantheon_fire.0002.desc.county_many: "[GetPlayer.MakeScope.Var('pantheon_fire_report_counties').GetValue|0] counties lie in ruin. "
 pantheon_fire.0002.desc.dead_one: "1 person is dead. "
 pantheon_fire.0002.desc.dead_many: "[GetPlayer.MakeScope.Var('pantheon_fire_report_dead').GetValue|0] people are dead. "
 pantheon_fire.0002.desc.title_one: "1 title has fallen. "
 pantheon_fire.0002.desc.title_many: "[GetPlayer.MakeScope.Var('pantheon_fire_report_titles').GetValue|0] titles have fallen. "
 pantheon_fire.0002.desc.tribal: "The rulers whose seats burned now hold their land as tribes. "
 pantheon_fire.0002.desc.blame: "The world knows who is to blame."
 pantheon_fire.0002.ok: "Let them remember."
 pantheon_fire.0003.t: "Fire from Heaven"
 pantheon_fire.0003.desc: "Fire fell from the sky on your lands. Holdings lie in ruin, many are dead, and what was a realm is ash. Someone called this down, and it was not a mercy."
 pantheon_fire.0003.ok: "God help us."

 # Task 10: Bless, Heal them (#72)
 pantheon_bless_opt_heal: "Heal them ([GetPlayer.MakeScope.ScriptValue('pantheon_cost_life')|0] Worship)"
 pantheon_bless_no_need_heal_tt: "They are not sick or wounded"
 pantheon_bless_suits_why_heal: "Suits them: they are sick or wounded."
 pantheon_tip.0300.heal.tt: "Every sickness and wound is cured, the plague included."

 # Task 7: the aftermath
 pantheon_fire_burning: "Burning Land"
 pantheon_fire_burning_desc: "Fire from heaven fell here. The fields, the roads and the hearths still burn, and nothing can grow."
 pantheon_fire_smouldering: "Smouldering Land"
 pantheon_fire_smouldering_desc: "The flames are out, but the smoke goes on and the ground stays dead."
 pantheon_fire_scarred: "Scarred Land"
 pantheon_fire_scarred_desc: "The fire is long past. The land lies cold and scorched, and recovers slowly."
 pantheon_fire_restoring: "Being Restored"
 pantheon_fire_restoring_desc: "Someone is working to heal this land. Ten years after the work began, the land moves one stage closer to healing."
 situation_pantheon_fire_scorch: "Scorched Land"
 situation_pantheon_fire_scorch_desc: "$situation_type_pantheon_fire_scorch_desc$"
 situation_type_pantheon_fire_scorch: "Scorched Land"
 situation_type_pantheon_fire_scorch_desc: "Land struck by fire from heaven. It burns, then smoulders, then lies scarred for decades before it heals."
 pantheon_fire_scorch_sub_region_pantheon_fire_area: "Scorched Land"
 pantheon_fire_scorch_sub_region_pantheon_fire_area_desc: "Affects [SituationSubRegion.GetAffectedTitlesList]"
 pantheon_fire_scorch_participant_group_pantheon_fire_rulers: "Rulers of Scorched Land"
 pantheon_fire_scorch_participant_group_pantheon_fire_rulers_desc: "Rulers whose realm holds scorched land"
 pantheon_fire_scorch_burning_situation_phase: "Burning"
 pantheon_fire_scorch_burning_situation_phase_desc: "The fire from heaven still burns across the land. Fields, roads and hearths are ablaze, and nothing grows."
 pantheon_fire_scorch_smouldering_situation_phase: "Smouldering"
 pantheon_fire_scorch_smouldering_situation_phase_desc: "The flames are out, but smoke still rises from the ruins and the ground stays dead."
 pantheon_fire_scorch_scarred_situation_phase: "Scarred"
 pantheon_fire_scorch_scarred_situation_phase_desc: "The land lies cold and scorched. It heals, but only over decades."

 # Task 8: the crater and the Restore decision
 building_type_pantheon_fire_crater_burning: "Burning Crater"
 building_type_pantheon_fire_crater_burning_desc: "Where the fire from heaven struck, the earth is torn open and still burns."
 building_pantheon_fire_crater_burning: "$building_type_pantheon_fire_crater_burning$"
 building_pantheon_fire_crater_burning_desc: "$building_type_pantheon_fire_crater_burning_desc$"
 building_type_pantheon_fire_crater_smouldering: "Smouldering Crater"
 building_type_pantheon_fire_crater_smouldering_desc: "The fires in the crater are out, but smoke still rises from the scorched pit."
 building_pantheon_fire_crater_smouldering: "$building_type_pantheon_fire_crater_smouldering$"
 building_pantheon_fire_crater_smouldering_desc: "$building_type_pantheon_fire_crater_smouldering_desc$"
 building_type_pantheon_fire_crater_cold: "Cold Crater"
 building_type_pantheon_fire_crater_cold_desc: "A cold, blackened pit marks where the fire from heaven struck. It will be gone when the land has healed."
 building_pantheon_fire_crater_cold: "$building_type_pantheon_fire_crater_cold$"
 building_pantheon_fire_crater_cold_desc: "$building_type_pantheon_fire_crater_cold_desc$"
 pantheon_fire_restore_decision: "Restore the Scorched Land"
 pantheon_fire_restore_decision_desc: "Fire from heaven has left some of your land scorched. Pay to start a restoration effort on one of your scorched counties: after ten years of work, it moves one stage closer to healing. Each county takes one effort at a time, and only while its current stage will last longer than the work."
 pantheon_fire_restore_decision_tooltip: "Start restoring one of your scorched counties"
 pantheon_fire_restore_decision_confirm: "Restore the land"
 pantheon_fire_restore_decision_effect_tt: "The least healed of your scorched counties, your capital first, moves one stage closer to healing in ten years"
