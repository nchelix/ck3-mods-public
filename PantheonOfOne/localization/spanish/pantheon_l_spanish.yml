l_spanish:
 pantheon_ascend_decision: "Ascend to Godhood"
 pantheon_ascend_decision_desc: "Mortality is a garment, and you are done wearing it. Become a god, and let the world learn to pray to you."
 pantheon_ascend_decision_tooltip: "Become Divine: immortal, unmatched, and beyond the reach of any plot."
 pantheon_ascend_decision_confirm: "I am a god"
 pantheon_ascend_decision_next_tt: "Next: right-click yourself and choose Divine Will to take your throne in heaven. To be worshipped under your own name, first create a branched rite in the Religion screen (free for a god), then Proclaim Your Divinity there."
 trait_pantheon_divine: "Divine"
 trait_pantheon_divine_desc: "This character is a god in mortal form: ageless, unmatched, and beyond the reach of any scheme."
 trait_pantheon_champion: "Champion of the God"
 trait_pantheon_champion_desc: "A god's strength runs in this character's arm."
 trait_pantheon_warlord: "Warlord of the God"
 trait_pantheon_warlord_desc: "Armies led by this character fight with divine fury."
 trait_pantheon_sovereign: "Sovereign of the God"
 trait_pantheon_sovereign_desc: "This character rules with a god's own authority."
 trait_pantheon_sage: "Sage of the God"
 trait_pantheon_sage_desc: "This character sees with a god's eyes."
 pantheon_holy_seat: "Holy Seat"
 pantheon_holy_seat_desc: "The seat of a living god. No army has ever breached its walls."
 pantheon_harvest: "Bountiful Harvest"
 pantheon_harvest_desc: "A god has blessed these fields."
 pantheon_walls: "Unbreachable Walls"
 pantheon_walls_desc: "A god's hand holds these walls."
 pantheon_warding: "Warded from Pestilence"
 pantheon_warding_desc: "Plague turns aside at this land's borders."
 pantheon_vigor: "Divine Vigor"
 pantheon_vigor_desc: "A god has touched this body."
 pantheon_fertility: "Divine Fertility"
 pantheon_fertility_desc: "A god has blessed this line."
 pantheon_blessed_opinion: "Blessed by their god"
 pantheon_host_maa: "Host of Heaven"
 pantheon_host_army_name: "The Host of Heaven"
 pantheon_divine_will_interaction: "Divine Will"
 pantheon_divine_will_interaction_desc: "Grant your follower a boon."
 rule_pantheon_divine_economy: "Divine Economy"
 setting_pantheon_economy_earned: "Earned Godhood"
 setting_pantheon_economy_earned_desc: "Worship flows modestly and boons are costly. Growing your faith is how a god grows."
 setting_pantheon_economy_sandbox: "Sandbox God"
 setting_pantheon_economy_sandbox_desc: "Worship flows fast, boons are cheap, and they last twice as long."
 pantheon.0001.t: "No Cell Can Hold a God"
 pantheon.0001.desc: "The chains fall away. You walk free, and your jailers do not dare to stop you."
 pantheon.0001.a: "As it should be."
 pantheon_menu.0001.t: "Divine Will"
 pantheon_menu.0001.desc: "[pantheon_target.GetShortUINameNoTooltip] kneels before you."
 pantheon_menu.0001.desc_self: "You turn your gaze inward, upon your own mortal vessel."
 pantheon_menu.0001.worship: "\n\nWorship: [ROOT.Char.MakeScope.Var('pantheon_worship').GetValue|0]"
 pantheon_menu.0001.throne: "Take your throne in heaven"
 pantheon_menu.0001.throne.tt: "Become the Head of your faith, ruling from an impregnable Holy Seat. Your followers' worship begins to flow to you."
 pantheon_menu.0001.proclaim: "Proclaim your divinity"
 pantheon_menu.0001.proclaim.tt: "Your rite is no mere branch of an older faith: it diverges until it stands as a faith of its own, with you as its god."
 pantheon_menu.0001.forswear: "Forswear mortal offspring"
 pantheon_menu.0001.forswear.tt: "You will father or bear no children. Take it back whenever you wish."
 pantheon_menu.0001.embrace: "Embrace mortal offspring"
 pantheon_menu.0001.embrace.tt: "Your children will be born demigods: gifted, beautiful and brilliant, though mortal."
 trait_pantheon_demigod: "Demigod"
 trait_pantheon_demigod_desc: "The child of a living god: gifted beyond any mortal, though mortal still."
 pantheon_forsworn: "Forsworn Offspring"
 pantheon_forsworn_desc: "This god has forsworn mortal children."
 pantheon_menu.0001.traits: "Grant a divine gift"
 pantheon_menu.0001.realm: "Bless their lands"
 pantheon_menu.0001.life: "Bless their life"
 pantheon_menu.0001.host: "Send the Host of Heaven ([EmptyScope.ScriptValue('pantheon_cost_host')|0] Worship)"
 pantheon_menu.0001.host.tt: "An army of the Host of Heaven descends at their capital to fight in one of their wars. It returns to heaven when that war ends."
 pantheon_menu.0001.close: "Leave them to their prayers"
 pantheon_menu.0100.t: "A Divine Gift"
 pantheon_menu.0100.desc: "Choose one gift. It fades after [EmptyScope.ScriptValue('pantheon_trait_years')|0] years. Each costs [EmptyScope.ScriptValue('pantheon_cost_trait')|0] Worship."
 pantheon_menu.0100.champion: "Champion of the God"
 pantheon_menu.0100.champion.tt: "+50 prowess and tripled knight effectiveness, for a time."
 pantheon_menu.0100.warlord: "Warlord of the God"
 pantheon_menu.0100.warlord.tt: "+10 martial, +20 battle advantage and +50% army damage, for a time."
 pantheon_menu.0100.sovereign: "Sovereign of the God"
 pantheon_menu.0100.sovereign.tt: "+10 diplomacy and stewardship, +50 vassal opinion and +50% income, for a time."
 pantheon_menu.0100.sage: "Sage of the God"
 pantheon_menu.0100.sage.tt: "+10 learning and intrigue, and far stronger, more secret schemes, for a time."
 pantheon_menu.0100.back: "Back"
 pantheon_menu.0200.t: "Bless Their Lands"
 pantheon_menu.0200.desc: "Each blessing covers every county they hold for [EmptyScope.ScriptValue('pantheon_blessing_years')|0] years and costs [EmptyScope.ScriptValue('pantheon_cost_realm')|0] Worship."
 pantheon_menu.0200.harvest: "Bountiful Harvest"
 pantheon_menu.0200.harvest.tt: "Double taxes and levies, and fast development, in all their counties."
 pantheon_menu.0200.walls: "Unbreachable Walls"
 pantheon_menu.0200.walls.tt: "Massive fortifications and garrisons in all their counties."
 pantheon_menu.0200.warding: "Warded from Pestilence"
 pantheon_menu.0200.warding.tt: "Plague turns aside from all their counties."
 pantheon_menu.0200.back: "Back"
 pantheon_menu.0300.t: "Bless Their Life"
 pantheon_menu.0300.desc: "Each blessing costs [EmptyScope.ScriptValue('pantheon_cost_life')|0] Worship."
 pantheon_menu.0300.vigor: "Divine Vigor"
 pantheon_menu.0300.vigor.tt: "They stop aging and grow hale for [EmptyScope.ScriptValue('pantheon_blessing_years')|0] years."
 pantheon_menu.0300.fertility: "Divine Fertility"
 pantheon_menu.0300.fertility.tt: "Their fertility doubles for [EmptyScope.ScriptValue('pantheon_blessing_years')|0] years."
 pantheon_menu.0300.lineage: "Blessed Lineage"
 pantheon_menu.0300.lineage.tt: "Their next child is born a beautiful genius."
 pantheon_menu.0300.back: "Back"
 pantheon_needs_worship_host_tt: "Requires [EmptyScope.ScriptValue('pantheon_cost_host')|0] Worship (you have [GetPlayer.MakeScope.Var('pantheon_worship').GetValue|0])"
 pantheon_needs_worship_trait_tt: "Requires [EmptyScope.ScriptValue('pantheon_cost_trait')|0] Worship (you have [GetPlayer.MakeScope.Var('pantheon_worship').GetValue|0])"
 pantheon_needs_worship_realm_tt: "Requires [EmptyScope.ScriptValue('pantheon_cost_realm')|0] Worship (you have [GetPlayer.MakeScope.Var('pantheon_worship').GetValue|0])"
 pantheon_needs_worship_life_tt: "Requires [EmptyScope.ScriptValue('pantheon_cost_life')|0] Worship (you have [GetPlayer.MakeScope.Var('pantheon_worship').GetValue|0])"
 pantheon.0030.t: "The Old Faith Holds"
 pantheon.0030.desc: "This rite was shaped by others, and the old faith's roots run too deep: it will not tear free.\n\nCreate a branched rite of your own in the Religion screen (it costs a god nothing), then proclaim your divinity again."
 pantheon.0030.a: "Then I shall make my own."
 pantheon_worship_toast_t: "The Faithful Pray"
 pantheon_worship_toast_tt: "+[GetPlayer.MakeScope.Var('pantheon_last_worship').GetValue|0] Worship this season (total [GetPlayer.MakeScope.Var('pantheon_worship').GetValue|0])"
 rule_pantheon_expiry_notices: "Boon Expiry Notices"
 setting_pantheon_notices_all: "All Boons"
 setting_pantheon_notices_all_desc: "You are told whenever any boon you granted fades."
 setting_pantheon_notices_gifts: "Divine Gifts Only"
 setting_pantheon_notices_gifts_desc: "You are told only when a divine gift (Champion, Warlord, Sovereign or Sage) fades."
 setting_pantheon_notices_off: "Off"
 setting_pantheon_notices_off_desc: "Boons fade in silence."
 pantheon_expired_gift_t: "[pantheon_faded.GetShortUINameNoTooltip]'s divine gift has faded"
 pantheon_expired_vigor_t: "[pantheon_faded.GetShortUINameNoTooltip]'s Divine Vigor has faded"
 pantheon_expired_realm_t: "The blessing on [pantheon_faded.GetShortUINameNoTooltip]'s lands has faded"
 pantheon_expired_fertility_t: "[pantheon_faded.GetShortUINameNoTooltip]'s Divine Fertility has faded"
 pantheon_gift_marker: "Gift of the God"
 pantheon_gift_marker_desc: "This character carries a divine gift. It fades when this does."
 pantheon_lineage_marker: "Blessed Lineage"
 pantheon_lineage_marker_desc: "This character's next child will be born a beautiful genius."
 pantheon_menu.0001.blessed: "Your Blessed"
 pantheon_menu.0300.conception: "Divine Conception"
 pantheon_menu.0300.conception.tt: "A child of the god is conceived, to be born a Demigod. They must be an adult of the opposite sex, neither of you already with child, and you must not have forsworn offspring. If not, nothing is spent."
 pantheon_menu.0400.t: "Your Blessed"
 pantheon_menu.0400.desc: "Those who carry your gifts, most recently blessed first:"
 pantheon_menu.0400.back: "Back"
 pantheon_menu.0400.trait_1: "\n[pantheon_blessed_1.GetShortUINameNoTooltip]: a divine gift, until [pantheon_blessed_1.MakeScope.Var('pantheon_ends_trait').GetValue|0]"
