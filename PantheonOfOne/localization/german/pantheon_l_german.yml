 pantheon.0060.desc_fertility: "[pantheon_suppliant.GetShortUINameNoTooltip] has no children, and prays for Divine Fertility."
 pantheon.0060.desc_vigor: "[pantheon_suppliant.GetShortUINameNoTooltip] feels the years, and prays for Divine Vigor."
 pantheon.0060.desc_warding: "Plague stalks [pantheon_suppliant.GetShortUINameNoTooltip]'s lands, and they pray to be Warded from Pestilence."
 pantheon.0060.desc_harvest: "[pantheon_suppliant.GetShortUINameNoTooltip] is poor and in debt, and prays to be freed of their debts and for a Bountiful Harvest."
 pantheon.0060.desc_debt: "[pantheon_suppliant.GetShortUINameNoTooltip] is poor and in debt, and prays to be freed of their debts."
 pantheon.0060.desc_gift: "[pantheon_suppliant.GetShortUINameNoTooltip] prays for a divine gift."
 pantheon.0060.devotion_wavering: "\n\nDevotion: [pantheon_suppliant.MakeScope.Var('pantheon_devotion').GetValue|0] (Wavering)"
 pantheon.0060.devotion_faithful: "\n\nDevotion: [pantheon_suppliant.MakeScope.Var('pantheon_devotion').GetValue|0] (Faithful)"
 pantheon.0060.devotion_devout: "\n\nDevotion: [pantheon_suppliant.MakeScope.Var('pantheon_devotion').GetValue|0] (Devout)"
 pantheon.0060.grant: "Grant it"
 pantheon.0060.grant.tt: "Answer their prayer in full."
 pantheon.0060.sign: "Send a sign"
 pantheon.0060.sign.tt: "A small mercy: a quarter of the boon, and a little faith."
 pantheon.0060.send: "Send one of your children"
 pantheon.0060.send.tt: "A demigod of yours answers in person: as their commander in war, or as their spouse. Opens the Children tab to choose which child goes; nothing is spent until you do, and the prayer stays open if you change your mind."
 pantheon.0060.refuse: "Refuse"
 pantheon.0060.refuse.tt: "Turn away from them. Their faith will suffer for it."
 pantheon_prayer_granted_t: "You answered [pantheon_suppliant.GetShortUINameNoTooltip]'s prayer (Devotion +20)"
 pantheon_prayer_sign_t: "You sent [pantheon_suppliant.GetShortUINameNoTooltip] a sign (Devotion +5)"
