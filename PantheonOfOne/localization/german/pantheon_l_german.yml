 pantheon_gift_marker: "Gift of the God"
 pantheon_gift_marker_desc: "This character carries a divine gift. It fades when this does."
 pantheon_lineage_marker: "Blessed Lineage"
 pantheon_lineage_marker_desc: "This character's next child will be born a beautiful genius."
 pantheon_menu.0001.blessed: "Your Blessed"
 pantheon_menu.0300.conception: "Divine Conception"
 pantheon_menu.0300.conception.tt: "A child of the god is conceived, to be born a Demigod. They must be an adult of the opposite sex, neither of you already with child, and you must not have forsworn offspring. If not, nothing is spent."
