 trait_pantheon_follower: "Follower"
 trait_pantheon_follower_zealous: "Zealous Follower"
 trait_pantheon_follower_devout: "Devout Follower"
 trait_pantheon_follower_faithful: "Faithful Follower"
 trait_pantheon_follower_wavering: "Wavering Follower"
 trait_pantheon_follower_lapsing: "Lapsing Follower"
 trait_pantheon_follower_desc: "A follower of the god: their Devotion, and what they wait on."
 trait_pantheon_follower_dead_desc: "They followed you in life."
 trait_pantheon_follower_character_desc: "Devotion: [ROOT.GetCharacter.MakeScope.Var('pantheon_devotion').GetValue|0] of 100. A Great Prayer can come at 90; Devout at 75; below 25 they may leave the faith, and below 10 they likely will."
 trait_track_pantheon_follower: "Devotion"
 trait_track_pantheon_follower_desc: "How fervently they worship you, from 0 to 100."
 pantheon_follower_prayer_1: "\nThey pray to you for help in war. Answer it on the Prayers tab."
 pantheon_follower_prayer_2: "\nThey pray to you for a child. Answer it on the Prayers tab."
 pantheon_follower_prayer_3: "\nThey pray to you for vigor. Answer it on the Prayers tab."
 pantheon_follower_prayer_4: "\nThey pray to you for protection from plague. Answer it on the Prayers tab."
 pantheon_follower_prayer_5: "\nThey pray to you for a good harvest. Answer it on the Prayers tab."
 pantheon_follower_prayer_5_debt: "\nThey pray to you to clear their debts. Answer it on the Prayers tab."
 pantheon_follower_prayer_7: "\nThey pray to you for healing. Answer it on the Prayers tab."
 pantheon_follower_prayer_8: "\nThey pray to you for a spouse. Answer it on the Prayers tab."
 pantheon_follower_prayer_9: "\nThey pray to you to be freed from prison. Answer it on the Prayers tab."
 pantheon_follower_prayer_6_1: "\nThey pray to you for a gift: the strength of a champion. Answer it on the Prayers tab."
 pantheon_follower_prayer_6_2: "\nThey pray to you for a gift: a warlord's command. Answer it on the Prayers tab."
 pantheon_follower_prayer_6_3: "\nThey pray to you for a gift: a sovereign's rule. Answer it on the Prayers tab."
 pantheon_follower_prayer_6_4: "\nThey pray to you for a gift: a sage's wisdom. Answer it on the Prayers tab."
 pantheon_follower_prayer_10: "\nThey pray to you for the freedom of [ROOT.GetCharacter.MakeScope.Var('pantheon_prayer_kin').GetCharacter.GetShortUINameNoTooltip]. Answer it on the Prayers tab."
 pantheon_follower_boon_1: "\nAsks a Great Boon: a crown, [ROOT.GetCharacter.MakeScope.Var('pantheon_aspiration_target').GetLandedTitle.GetNameNoTooltip] ([ROOT.GetCharacter.MakeScope.Var('pantheon_glance_god').GetCharacter.MakeScope.ScriptValue('pantheon_cost_boon_crown')|0] Worship). Grant it with Grant their Great Boon."
 pantheon_follower_boon_2: "\nAsks a Great Boon: the life of [ROOT.GetCharacter.MakeScope.Var('pantheon_aspiration_target').GetCharacter.GetShortUINameNoTooltip] ([ROOT.GetCharacter.MakeScope.Var('pantheon_glance_god').GetCharacter.MakeScope.ScriptValue('pantheon_cost_boon_kin')|0] Worship). Grant it with Grant their Great Boon."
 pantheon_follower_boon_3: "\nAsks a Great Boon: victory in [ROOT.GetCharacter.MakeScope.Var('pantheon_aspiration_target').War.GetName] ([ROOT.GetCharacter.MakeScope.Var('pantheon_glance_god').GetCharacter.MakeScope.ScriptValue('pantheon_cost_boon_war')|0] Worship). Grant it with Grant their Great Boon."
 pantheon_follower_boon_4: "\nAsks a Great Boon: a child ([ROOT.GetCharacter.MakeScope.Var('pantheon_glance_god').GetCharacter.MakeScope.ScriptValue('pantheon_cost_boon_heir')|0] Worship). Grant it with Grant their Great Boon."
 pantheon_follower_boon_5: "\nAsks a Great Boon: their land brought to you ([ROOT.GetCharacter.MakeScope.Var('pantheon_glance_god').GetCharacter.MakeScope.ScriptValue('pantheon_cost_boon_conversion')|0] Worship). Grant it with Grant their Great Boon."
 pantheon_follower_boon_6: "\nAsks a Great Boon: their fortune restored ([ROOT.GetCharacter.MakeScope.Var('pantheon_glance_god').GetCharacter.MakeScope.ScriptValue('pantheon_cost_boon_fortune')|0] Worship). Grant it with Grant their Great Boon."
 pantheon_follower_boon_7: "\nAsks a Great Boon: to be freed from prison ([ROOT.GetCharacter.MakeScope.Var('pantheon_glance_god').GetCharacter.MakeScope.ScriptValue('pantheon_cost_boon_freedom')|0] Worship). Grant it with Grant their Great Boon."
 pantheon_follower_boon_7_kin: "\nAsks a Great Boon: the freedom of [ROOT.GetCharacter.MakeScope.Var('pantheon_aspiration_target').GetCharacter.GetShortUINameNoTooltip] ([ROOT.GetCharacter.MakeScope.Var('pantheon_glance_god').GetCharacter.MakeScope.ScriptValue('pantheon_cost_boon_freedom')|0] Worship). Grant it with Grant their Great Boon."
 pantheon_follower_grievance_1: "\nThey hold a grievance: [ROOT.GetCharacter.MakeScope.Var('pantheon_grievance_target').GetCharacter.GetShortUINameNoTooltip] murdered their kin. You can answer it with Pass Judgement."
 pantheon_follower_grievance_2: "\nThey hold a grievance: [ROOT.GetCharacter.MakeScope.Var('pantheon_grievance_target').GetCharacter.GetShortUINameNoTooltip] won a war against them. You can answer it with Pass Judgement."
 pantheon_follower_grievance_3: "\nThey hold a grievance: [ROOT.GetCharacter.MakeScope.Var('pantheon_grievance_target').GetCharacter.GetShortUINameNoTooltip] seized a holy site of theirs. You can answer it with Pass Judgement."
 pantheon_follower_grievance_4: "\nThey hold a grievance: [ROOT.GetCharacter.MakeScope.Var('pantheon_grievance_target').GetCharacter.GetShortUINameNoTooltip] imprisoned them. You can answer it with Pass Judgement."
 pantheon_follower_grievance_5: "\nThey hold a grievance: [ROOT.GetCharacter.MakeScope.Var('pantheon_grievance_target').GetCharacter.GetShortUINameNoTooltip] tortured them. You can answer it with Pass Judgement."
 pantheon_follower_grievance_6: "\nThey hold a grievance: [ROOT.GetCharacter.MakeScope.Var('pantheon_grievance_target').GetCharacter.GetShortUINameNoTooltip] raided them. You can answer it with Pass Judgement."
 pantheon_follower_oath: "\nYou swore to avenge them against [ROOT.GetCharacter.MakeScope.Var('pantheon_glance_god').GetCharacter.MakeScope.Var('pantheon_great_prayer_offender').GetCharacter.GetShortUINameNoTooltip]."
 pantheon_follower_retribution: "\nTheir attacker is open to your Retribution."
