l_russian:
 # Pantheon of One 2.9 "Grace". Four blessings that are also prayer needs (11-14): Cleanse their vices, Make them whole,
 # Comfort in grief, Mend a feud. English only here; tools/sync_pantheon_loc.py copies this file to the other languages.
 pantheon_bless_opt_cleanse: "Cleanse their vices ([GetPlayer.MakeScope.ScriptValue('pantheon_cost_life')|0] Worship)"
 pantheon_bless_opt_whole: "Make them whole ([GetPlayer.MakeScope.ScriptValue('pantheon_cost_life')|0] Worship)"
 pantheon_bless_opt_grief: "Comfort in grief ([GetPlayer.MakeScope.ScriptValue('pantheon_cost_life')|0] Worship)"
 pantheon_bless_opt_feud: "Mend a feud ([GetPlayer.MakeScope.ScriptValue('pantheon_cost_life')|0] Worship)"
 pantheon_bless_no_need_cleanse_tt: "They have no vice to cleanse and are not deeply stressed"
 pantheon_bless_no_need_whole_tt: "They carry no lasting injury"
 pantheon_bless_no_need_grief_tt: "They are not grieving a death in the family"
 pantheon_bless_no_need_feud_tt: "They have no living rival"
 pantheon_bless_suits_why_cleanse: "Suits them: stress has driven them to a vice."
 pantheon_bless_suits_why_whole: "Suits them: they carry a lasting injury."
 pantheon_bless_suits_why_grief: "Suits them: they are grieving a death in the family."
 pantheon_bless_suits_why_feud: "Suits them: they have a rival."
 pantheon_tip.0300.cleanse.tt: "Their drink, drugs, rage, self-harm and other vices of stress are lifted, and their stress is cleared."
 pantheon_tip.0300.whole.tt: "Every lasting injury and wound is healed: lost eyes and limbs, blindness, disfigurement."
 pantheon_tip.0300.grief.tt: "Their stress eases, and half of the Devotion the death cost you is given back."
 pantheon_tip.0300.feud.tt: "One of their rivals is reconciled with them, on both sides."
 pantheon_prayer_need_cleanse: "Prays to be cleansed of their vices"
 pantheon_prayer_need_whole: "Prays to be made whole"
 pantheon_prayer_need_grief: "Prays for comfort in grief"
 pantheon_prayer_need_feud: "Prays for a feud to be mended"
 pantheon.0060.desc_cleanse: "[pantheon_suppliant.GetShortUINameNoTooltip] is bowed by stress and the vices it brought, and prays to be cleansed."
 pantheon.0060.desc_whole: "[pantheon_suppliant.GetShortUINameNoTooltip] bears a lasting injury, and prays to be made whole."
 pantheon.0060.desc_grief: "[pantheon_suppliant.GetShortUINameNoTooltip] is grieving a death in the family, and prays for comfort."
 pantheon.0060.desc_feud: "[pantheon_suppliant.GetShortUINameNoTooltip] is at odds with a rival, and prays for the feud to be mended."
 pantheon_follower_prayer_11: "\nThey pray to you to be cleansed of their vices. Answer it on the Prayers tab."
 pantheon_follower_prayer_12: "\nThey pray to you to be made whole. Answer it on the Prayers tab."
 pantheon_follower_prayer_13: "\nThey pray to you for comfort in grief. Answer it on the Prayers tab."
 pantheon_follower_prayer_14: "\nThey pray to you to mend a feud. Answer it on the Prayers tab."
 # Quiet prayers, the window (Task 4): the Prayers tab's fourth sub-tab, its rows and the Pantheon button's second badge.
 pantheon_ui_ptab_quiet: "Quiet"
 pantheon_ui_quiet_header: "Quiet prayers"
 pantheon_ui_quiet_header_tt: "Followers whose Devotion is slipping pray in silence. Only you see them, and each fades after a year if left alone. Answer one to do what it asks and raise their Devotion; let it pass to close it for free."
 pantheon_ui_quiet_empty: "No quiet prayers. They come as your followers' Devotion slips."
 pantheon_ui_quiet_kingdom_n: "Quiet prayers: [Title.MakeScope.Var('pantheon_ui_quiet_n').GetValue|0]"
 pantheon_ui_quiet_devotion: "Devotion [Character.MakeScope.ScriptValue('pantheon_ui_devotion')|0]"
 pantheon_ui_quiet_left: "[GetTimeDifferenceWithDays( Character.MakeScope.VarRemaining('pantheon_quiet_fades') )] left"
 pantheon_ui_quiet_kingdom: "[Character.MakeScope.Var('pantheon_quiet_kingdom').GetLandedTitle.GetNameNoTooltip]"
 pantheon_ui_quiet_no_kingdom: "No kingdom"
 pantheon_ui_btn_quiet_answer: "Answer ([Character.MakeScope.Var('pantheon_quiet_price').GetValue|0])"
 pantheon_ui_btn_quiet_pass: "Let it pass"
 pantheon_ui_quiet_answer_after_tt: "Do what they quietly ask and raise their Devotion by 10. Costs [Character.MakeScope.Var('pantheon_quiet_price').GetValue|0] Worship (you have [GetPlayer.MakeScope.Var('pantheon_worship').GetValue|0])."
 pantheon_ui_quiet_pass_after_tt: "Let this prayer pass. Free, but they will not pray quietly again for a year."
 pantheon_quiet_no_longer_tt: "This quiet prayer is no longer open."
 pantheon_ui_quiet_worship_tt: "Requires Worship equal to the price on this prayer (you have [GetPlayer.MakeScope.Var('pantheon_worship').GetValue|0])."
 pantheon_ui_button_tt_q: "The Pantheon\n[GetPlayer.MakeScope.ScriptValue('pantheon_ui_count_quiet')|0] followers pray in silence."
 pantheon_ui_button_tt_nq: "The Pantheon\n[GetPlayer.MakeScope.ScriptValue('pantheon_ui_open_prayer_count')|0] prayers, calls and waiting boons await your answer.\n[GetPlayer.MakeScope.ScriptValue('pantheon_ui_count_quiet')|0] followers pray in silence."
 # The steadying act (Task 5), "A Sign of Steadfastness": the Temple tab's section, its Send/Cancel panel, the reasons its buttons grey with, and its toasts.
 pantheon_ui_steady_header: "A Sign of Steadfastness"
 pantheon_ui_steady_header_tt: "A sign from the god to a faith in trouble, sent from the Great Temple. Everyone it reaches regains 20 Devotion, is sheltered for a year (blame costs them no Devotion), and has any quiet prayer answered as a sign. It does not grant what they prayed for. Paid in Worship; the wider the reach, the dearer. After it, the god must rest five years."
 pantheon_ui_btn_steady_slipping: "The slipping"
 pantheon_ui_btn_steady_faith: "The whole faith"
 pantheon_ui_btn_steady_kingdom: "Steady"
 pantheon_ui_steady_slipping_tt: "Steady the followers who are falling: Devotion below 50, or who blamed you in the last year. Needs a Shrine or better. See the count and the price before you send."
 pantheon_ui_steady_faith_tt: "Steady every follower of the faith. Very dear. Needs a Great Temple. See the count and the price before you send."
 pantheon_ui_steady_kingdom_after_tt: "Steady every follower in [Title.GetNameNoTooltip]. Needs a Temple or better. See the count and the price before you send."
 pantheon_ui_steady_cooldown_line: "Rests [GetTimeDifferenceWithDays( GetPlayer.MakeScope.VarRemaining('pantheon_steady_cooldown') )]"
 pantheon_ui_steady_kingdom_empty: "No kingdom holds a follower yet."
 pantheon_ui_steady_kingdom_n: "[Title.MakeScope.Var('pantheon_ui_steady_n').GetValue|0] followers"
 pantheon_ui_steady_armed_1: "Armed: the slipping"
 pantheon_ui_steady_armed_2: "Armed: [GetPlayer.MakeScope.Var('pantheon_steady_kingdom').GetLandedTitle.GetNameNoTooltip]"
 pantheon_ui_steady_armed_3: "Armed: the whole faith"
 pantheon_ui_steady_armed_line: "Reaches [GetPlayer.MakeScope.Var('pantheon_steady_count').GetValue|0] followers. Costs [GetPlayer.MakeScope.Var('pantheon_steady_price').GetValue|0] Worship (you have [GetPlayer.MakeScope.Var('pantheon_worship').GetValue|0])."
 pantheon_ui_steady_effects: "Each: +20 Devotion, no blame cost for a year, quiet prayers answered as a sign."
 pantheon_ui_steady_effects_tt: "Each follower reached regains 20 Devotion (up to 100), is sheltered for a year (a blame costs them no Devotion, though it still happens), and has any open quiet prayer closed as a sign for 10 more Devotion; the blessing they prayed for is not given. The count and price are worked out again when you send. Then you must rest five years."
 pantheon_ui_btn_steady_send: "Send the sign"
 pantheon_ui_btn_steady_cancel: "Cancel"
 pantheon_ui_steady_send_after_tt: "Send the sign. The count and the price are worked out again, and nothing is charged if the reach has since closed or the price is out of reach."
 pantheon_ui_steady_cancel_tt: "Put the sign down. Nothing is charged."
 pantheon_steady_dormant_tt: "A Great Temple must stand, in faithful hands (a dormant temple unlocks nothing)."
 pantheon_steady_tier_1_tt: "Needs a Great Temple of at least the first tier (Shrine)."
 pantheon_steady_tier_3_tt: "Needs a Great Temple of at least the third tier (Temple)."
 pantheon_steady_tier_5_tt: "Needs a Great Temple of the fifth tier (Great Temple)."
 pantheon_steady_cooldown_tt: "The god is resting after the last sign: [GetTimeDifferenceWithDays( GetPlayer.MakeScope.VarRemaining('pantheon_steady_cooldown') )] left."
 pantheon_steady_nobody_tt: "Nobody is in reach."
 pantheon_warded_person: "Warded by the God"
 pantheon_warded_person_desc: "The god has warded them from sickness: no plague or disease can touch them while the ward lasts."
 pantheon_steady_nobody_slipping_tt: "Nobody is slipping: no follower is under 50 Devotion, and none has blamed you in the past year."
 pantheon_steady_no_kingdom_tt: "Pick a kingdom."
 pantheon_steady_not_armed_tt: "Nothing is armed, or nobody is in reach."
 pantheon_steady_reach_closed_tt: "The reach is no longer open: the Great Temple's tier, a dormant temple or the rest."
 pantheon_steady_worship_tt: "Requires Worship equal to the price (you have [GetPlayer.MakeScope.Var('pantheon_worship').GetValue|0])."
 pantheon_steady_nobody_t: "No one to steady"
 pantheon_steady_sent_t: "A Sign of Steadfastness"
 pantheon_steady_sent_tt: "The sign has steadied [GetPlayer.MakeScope.Var('pantheon_steady_last_count').GetValue|0] followers: Devotion restored, sheltered from blame for a year, quiet prayers answered. You rest five years."
 pantheon_steady_stopped_t: "The sign was not sent"
 pantheon_steady_stopped_tt: "The reach had closed, no one was in it, or the price was out of reach. Nothing was charged."
 # 2.9 (Section E): the Freedom Great Boon when the game names no jailer at the moment it shows (the prison changed hands)
 pantheon.0066.desc_kin_freedom_nojailer: "[pantheon_boon_event_follower.GetShortUINameNoTooltip] pleads for [pantheon_boon_event_prisoner.GetShortUINameNoTooltip], a captive of war: \"Break their chains, Most High.\""
 pantheon.0066.desc_freedom_nojailer: "[pantheon_boon_event_follower.GetShortUINameNoTooltip] lies captive, a prize of war: \"Break my chains, Most High.\""
