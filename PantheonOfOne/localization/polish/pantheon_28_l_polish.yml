# 2.8 (#59): the Godhood tour
 pantheon_ui_btn_tour: "Godhood tour"
 pantheon_tip.0001.tour.tt: "Walk among mortals in a land that does not share your faith. Your deeds there plant a seed that lets you win its lords and its people. It costs gold and prestige, never Worship."
 activity_pantheon_tour: "Godhood Tour"
 activity_pantheon_tour_name: "[ACTIVITY.GetHost.GetNamePossessiveOrMy|U] Godhood Tour"
 activity_pantheon_tour_selection_tooltip: "Walk among the mortals of a land that does not know you. Heal or terrify, bless or burn: what you do there plants a seed in its county, and perhaps in its duchy and kingdom."
 activity_pantheon_tour_desc: "A god walking among unbelievers, seeking to be known."
 activity_pantheon_tour_host_desc: "$BULLET_WITH_TAB$Plants a seed of belief where you walk, with a lean toward fear or kindness"
 activity_pantheon_tour_owner: "Host"
 activity_pantheon_tour_conclusion_desc: "I walked among them, and they will remember."
 activity_pantheon_tour_guest_desc: "A god walks here."
 activity_pantheon_tour_guest_help_text: "$activity_pantheon_tour_desc$"
 activity_pantheon_tour_province_desc: "A land that does not yet know you."
 activity_pantheon_tour_destination_selection: "Choose any county whose faith is not yours."
 activity_pantheon_tour_predicted_cost: "The cost of a [GetActivityType( 'activity_pantheon_tour' ).GetNameNoTooltip] is some gold and prestige. It never costs Worship."
 activity_pantheon_tour_host_an_a: "$host_activity_a$"
 pantheon_tour_phase: "Among Mortals"
 pantheon_tour_phase_desc: "Walk among the people and let them see what you are."
 activity_window_character_god: "The God"
 TRAVEL_NAME_FOR_activity_pantheon_tour: "Godhood tour"
 pantheon_tour.0010.t: "A Sick Child"
 pantheon_tour.0010.desc: "A mother carries her feverish child to you, not knowing what you are. The crowd behind her waits to see what a god does."
 pantheon_tour.0010.fear: "Strike the fever down with a terrible word"
 pantheon_tour.0010.kind: "Heal the child with a touch"
 pantheon_tour.0010.cheap: "Say a quiet word and move on"
 pantheon_tour.0020.t: "The Harvest"
 pantheon_tour.0020.desc: "The fields here are thin and the granary is nearly empty. The people look at the sky, and then at you."
 pantheon_tour.0020.fear: "Burn the hoarder's granary as a warning"
 pantheon_tour.0020.kind: "Bless the harvest"
 pantheon_tour.0020.cheap: "Walk the fields in silence"
 pantheon_tour.0030.t: "A Sign in the Sky"
 pantheon_tour.0030.desc: "Word of the stranger has spread. A crowd gathers at the crossroads, wanting a sign."
 pantheon_tour.0030.fear: "Split the sky with fire"
 pantheon_tour.0030.kind: "Let the clouds part for a soft light"
 pantheon_tour.0030.cheap: "Show them nothing"
 pantheon_tour.0040.t: "The Last Night"
 pantheon_tour.0040.desc: "On your last night here a shrine-keeper of the old gods asks what you want from his people."
 pantheon_tour.0040.fear: "Tell him the old gods are ash"
 pantheon_tour.0040.kind: "Tell him you will protect his people"
 pantheon_tour.0040.cheap: "Say little, and leave at dawn"
 pantheon_tour.0090.t: "The Tour Ends"
 pantheon_tour.0090.desc_county: "You leave [pantheon_tour_county.GetName] behind. A seed of belief remains there."
 pantheon_tour.0090.lean_fear: " It leans toward fear."
 pantheon_tour.0090.lean_kind: " It leans toward kindness."
 pantheon_tour.0090.lean_none: " It leans neither toward fear nor toward kindness."
 pantheon_tour.0090.desc_meter: "\n\n[pantheon_tour_county.GetName] now stands [pantheon_tour_county.MakeScope.Var('pantheon_meter').GetValue|0]% turned to your faith. The seed will last until the year [pantheon_tour_county.MakeScope.Var('pantheon_seed_end').GetValue|0]."
 pantheon_tour.0090.desc_duchy: "\n\nThe seed took there, and spread across the whole of [pantheon_tour_duchy.GetName]: [pantheon_god.MakeScope.Var('pantheon_tour_spread_duchy').GetValue|0] counties there now carry it."
 pantheon_tour.0090.desc_kingdom: "\n\nThe seed took there, spread across [pantheon_tour_duchy.GetName], and carried on through all of [pantheon_tour_kingdom.GetName]: [pantheon_god.MakeScope.Var('pantheon_tour_spread_kingdom').GetValue|0] counties of the kingdom now carry it."
 pantheon_tour.0090.desc_turned: "\n\n[pantheon_tour_county.GetName] already follows your faith. The seed will last until the year [pantheon_tour_county.MakeScope.Var('pantheon_seed_end').GetValue|0]."
 pantheon_tour.0090.desc_nospread: "\n\nIt did not spread beyond that county."
 pantheon_tour.0090.ok: "Let them remember"
 # 2.8 (#59): works
 pantheon_begin_work_interaction: "Begin a Work"
 pantheon_begin_work_interaction_desc: "Work on a lord of another faith, in land where you have planted a seed, by fear or by kindness. It costs no Worship. Every few months your work asks something of you, and it does not advance while you ignore it."
 pantheon_work_opt_fear: "Fear"
 pantheon_work_opt_kindness: "Kindness"
 pantheon_work_cap_tt: "You are already working on as many lords as you can at once"
 pantheon_work_dup_tt: "You are already working on this lord"
 pantheon_work_begin_fear.tt: "You will begin a work of fear on this lord"
 pantheon_work_begin_kindness.tt: "You will begin a work of kindness on this lord"
 pantheon_work_frozen_reason: "A work only moves when you choose"
 pantheon_work_exposed_opinion: "Tormented by a god"
 pantheon_work_odds_lean: "The land already leans this way"
 pantheon_work_odds_zealous: "Zealous"
 pantheon_work_odds_cynical: "Cynical"
 pantheon_work_fear: "Work of Fear"
 pantheon_work_fear_action: "Work Fear Upon"
 pantheon_work_fear_desc_general: "The Work of Fear is a [scheme|E] that leaves a lord of another faith to learn what the old gods cannot stop. It only moves when you choose, one step every few months."
 pantheon_work_fear_desc: "Plague, nightmares and burnt holdings: you teach a lord of another faith what the old gods cannot stop. A bigger lord takes more. The work moves only when you choose, and a risky choice can be seen for what it is."
 pantheon_work_fear_success_desc: "The lord breaks, and kneels to you."
 pantheon_work_fear_discovery_desc: "The lord learns who is behind their misfortune, and turns hostile."
 pantheon_work_kindness: "Work of Kindness"
 pantheon_work_kindness_action: "Work Kindness Upon"
 pantheon_work_kindness_desc_general: "The Work of Kindness is a [scheme|E] that wins a lord of another faith with mercy and gifts. It only moves when you choose, one step every few months."
 pantheon_work_kindness_desc: "Healing, harvests, visions and rescue: you show a lord of another faith what a god can give. A bigger lord takes more. The work moves only when you choose."
 pantheon_work_kindness_success_desc: "The lord is won, and comes to believe in you."
 pantheon_work_kindness_discovery_desc: "The lord suspects a trick behind your gifts, and turns hostile."
 pantheon_work_fear_2: "Work of Fear"
 pantheon_work_fear_2_action: "Work Fear Upon"
 pantheon_work_fear_2_desc_general: "The Work of Fear is a [scheme|E] that leaves a lord of another faith to learn what the old gods cannot stop. It only moves when you choose, one step every few months."
 pantheon_work_fear_2_desc: "$pantheon_work_fear_desc$"
 pantheon_work_fear_3: "Work of Fear"
 pantheon_work_fear_3_action: "Work Fear Upon"
 pantheon_work_fear_3_desc_general: "The Work of Fear is a [scheme|E] that leaves a lord of another faith to learn what the old gods cannot stop. It only moves when you choose, one step every few months."
 pantheon_work_fear_3_desc: "$pantheon_work_fear_desc$"
 pantheon_work_kindness_2: "Work of Kindness"
 pantheon_work_kindness_2_action: "Work Kindness Upon"
 pantheon_work_kindness_2_desc_general: "The Work of Kindness is a [scheme|E] that wins a lord of another faith with mercy and gifts. It only moves when you choose, one step every few months."
 pantheon_work_kindness_2_desc: "$pantheon_work_kindness_desc$"
 pantheon_work_kindness_3: "Work of Kindness"
 pantheon_work_kindness_3_action: "Work Kindness Upon"
 pantheon_work_kindness_3_desc_general: "The Work of Kindness is a [scheme|E] that wins a lord of another faith with mercy and gifts. It only moves when you choose, one step every few months."
 pantheon_work_kindness_3_desc: "$pantheon_work_kindness_desc$"
 pantheon_work_switch_kindness_full_tt: "You have a free place for another work of kindness"
 pantheon_work_switch_fear_full_tt: "You have a free place for another work of fear"
 pantheon_work.0003.t: "A Work Fails"
 pantheon_work.0003.desc: "[target.GetShortUIName] has seen what is behind the signs, and turns on you. The seed in their capital will fade sooner for it."
 pantheon_work.0003.ok: "So be it"
 pantheon_work.0004.t: "A Work Comes to Nothing"
 pantheon_work.0004.desc: "[target.GetShortUIName] would have knelt, but their faith is not theirs to change. The work is spent, and nothing was gained."
 pantheon_work.0004.ok: "So be it"
 pantheon_work.0100.t: "Nightmares"
 pantheon_work.0100.desc: "[target.GetShortUIName] wakes screaming in the dark. In the dream something stood at the foot of the bed, wearing your face."
 pantheon_work.0100.bold: "Send the dream again, and worse"
 pantheon_work.0100.soft: "Send one quiet dream"
 pantheon_work.0100.let: "Let it be"
 pantheon_work.0110.t: "Plague in the Villages"
 pantheon_work.0110.desc: "A fever has come to the villages around [target.GetShortUIName]. The priests of the old gods burn their herbs and it spreads all the same. It would be easy to make it worse."
 pantheon_work.0110.bold: "Loose the fever on their villages"
 pantheon_work.0110.soft: "Sicken one village, and spare it at a prayer to you"
 pantheon_work.0110.let: "Let it be"
 pantheon_work.0120.t: "A Burnt Holding"
 pantheon_work.0120.desc: "The granary of [target.GetShortUIName]'s best estate stands full under a dry moon. Nobody would know whose fire it was."
 pantheon_work.0120.bold: "Burn the granary"
 pantheon_work.0120.soft: "Burn a barn the night before the feast"
 pantheon_work.0120.let: "Let it be"
 pantheon_work.0130.t: "Bad Omens"
 pantheon_work.0130.desc: "Word reaches you that [target.GetShortUIName] has begun to ask their seers what the signs mean. The seers do not like the answers."
 pantheon_work.0130.bold: "Darken the sun at noon"
 pantheon_work.0130.soft: "Let the crows gather on their walls"
 pantheon_work.0130.let: "Let it be"
 pantheon_work.0140.t: "The Hall Falls Silent"
 pantheon_work.0140.desc: "[target.GetShortUIName] holds court and waits for a verdict from the old gods' priest. The priest has not spoken for a week."
 pantheon_work.0140.bold: "Strike the whole court dumb for a day"
 pantheon_work.0140.soft: "Let their hall go quiet and cold"
 pantheon_work.0140.let: "Let it be"
 pantheon_work.0150.t: "A Second Road"
 pantheon_work.0150.desc: "[target.GetShortUIName] flinches when your name is spoken, but they have not broken. There is another road: you could stop frightening them and start giving."
 pantheon_work.0150.bold: "Press the fear a little more"
 pantheon_work.0150.let: "Let it be"
 pantheon_work.0150.switch: "Take the other road, and begin a work of kindness"
 pantheon_work.0200.t: "A Sick Child"
 pantheon_work.0200.desc: "The youngest child of [target.GetShortUIName] has been fevered for nine days. The healers have stopped meeting their eyes."
 pantheon_work.0200.bold: "Heal the child openly"
 pantheon_work.0200.soft: "Leave a remedy at their door"
 pantheon_work.0200.let: "Let it be"
 pantheon_work.0210.t: "A Good Harvest"
 pantheon_work.0210.desc: "The fields of [target.GetShortUIName] are thin this year, and the tenants have started to mutter about the old gods' priests."
 pantheon_work.0210.bold: "Fill their granaries before the frost"
 pantheon_work.0210.soft: "Send rain in the dry month"
 pantheon_work.0210.let: "Let it be"
 pantheon_work.0220.t: "A Vision"
 pantheon_work.0220.desc: "[target.GetShortUIName] sits long at the grave of someone they lost. They have stopped believing anyone is listening."
 pantheon_work.0220.bold: "Come to them in a dream of their dead"
 pantheon_work.0220.soft: "Whisper a name only they know"
 pantheon_work.0220.let: "Let it be"
 pantheon_work.0230.t: "A Rescue"
 pantheon_work.0230.desc: "A river in flood has trapped [target.GetShortUIName]'s riders on the far bank. The water is rising."
 pantheon_work.0230.bold: "Carry them across with your own hands"
 pantheon_work.0230.soft: "Let the water drop by an hour"
 pantheon_work.0230.let: "Let it be"
 pantheon_work.0240.t: "A Gift"
 pantheon_work.0240.desc: "[target.GetShortUIName] has a quarrel in their house that has outlasted three feasts, and nobody can mend it."
 pantheon_work.0240.bold: "Send a gift that fits no hand but theirs"
 pantheon_work.0240.soft: "Mend the quarrel in their sleep"
 pantheon_work.0240.let: "Let it be"
 pantheon_work.0250.t: "A Second Road"
 pantheon_work.0250.desc: "[target.GetShortUIName] takes your gifts and thanks the old gods for them. Kindness alone may never turn them, and there is another road."
 pantheon_work.0250.bold: "Give a little more"
 pantheon_work.0250.let: "Let it be"
 pantheon_work.0250.switch: "Take the other road, and begin a work of fear"
 pantheon_work_risk_tt: "There is a chance this is seen for what it is, and the work fails"
 pantheon_work.0002.t: "A Work Is Won"
 pantheon_work.0002.desc_fear: "[target.GetShortUIName] has broken, and kneels to you. Their family and court follow them, afraid, and the lands they hold are open to you.\n\nThe people pay you [ROOT.GetCharacter.MakeScope.Var('pantheon_work_reward_shown').GetValue|0] Worship, and the seed spreads through their counties."
 pantheon_work.0002.desc_kind: "[target.GetShortUIName] has come to believe in you. Their family and court follow them gladly, and the lands they hold are open to you.\n\nThe people pay you [ROOT.GetCharacter.MakeScope.Var('pantheon_work_reward_shown').GetValue|0] Worship, and the seed spreads through their counties."
 pantheon_work.0002.ok: "It is done"
